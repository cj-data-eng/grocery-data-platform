[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grocery-platform"
version = "0.1.0"
description = "Synthetic grocery retail data generation and ingestion"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "faker>=30",
    "pyarrow>=17",
]

[project.optional-dependencies]
dev = [
    "moto[s3]>=5",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
grocery-platform = "grocery_platform.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=grocery_platform --cov-report=term-missing"

[tool.ruff]
line-length = 100
extend-exclude = ["airflow/.astro", "airflow/tests/dags/test_dag_example.py"]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true