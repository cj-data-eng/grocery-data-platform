version: 2

models:
  - name: stg_basket_lines
    description: Cleaned basket lines with typed dates and a computed line total (in pence).
    columns:
      - name: basket_id
        description: Identifier of the shopping basket (a UUID).
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: category
        description: Product category.
        data_tests:
          - accepted_values:
              arguments:
                values: ["dairy", "bakery", "produce", "meat", "pantry", "drinks"]
      - name: quantity
        description: Units bought on this line.
      - name: line_total_pence
        description: quantity * unit_price_pence, kept as integer pence.