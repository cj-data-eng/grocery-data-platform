name: terraform-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read # permissions: contents: read gives the workflow the minimum access it needs, in the same least-privilege spirit as the AWS side.

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Check formatting
        run: terraform fmt -check -recursive # fmt -check fails the build if anything isn’t formatted, rather than silently fixing it.
        working-directory: infra

      - name: Validate bootstrap
        run: terraform init -backend=false -input=false && terraform validate # -backend=false lets validate run without touching AWS, so this job needs no credentials at all.
        working-directory: infra/bootstrap

      - name: Validate dev
        run: terraform init -backend=false -input=false && terraform validate
        working-directory: infra/envs/dev

  plan-dev:
    needs: validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # id-token: write lets the job request GitHub’s identity token. It’s a permission on this job only, not on the whole workflow.
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::511454199223:role/gh-actions-terraform-plan
          aws-region: eu-west-2

      - name: Terraform init
        run: terraform init -input=false
        working-directory: infra/envs/dev

      - name: Terraform plan
        run: terraform plan -input=false -lock=false # -lock=false means plan only reads state and never writes to the bucket, which keeps the role read-only. That’s safe because a plan changes nothing.
        working-directory: infra/envs/dev

  apply-dev:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: terraform-apply-dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::511454199223:role/gh-actions-terraform-apply
          aws-region: eu-west-2

      - name: Terraform init
        run: terraform init -input=false
        working-directory: infra/envs/dev

      - name: Terraform apply
        run: terraform apply -input=false -auto-approve
        working-directory: infra/envs/dev

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check . && ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dbt/requirements.txt

      - name: Install dbt
        run: pip install -r dbt/requirements.txt

      - name: Parse project
        run: dbt parse --profiles-dir .
        working-directory: dbt
        env:
          AWS_DEFAULT_REGION: eu-west-2